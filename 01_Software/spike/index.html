<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, initial-scale=1, user-scalable=no">
<title>Dashboard Spike</title>
<style>
  :root {
    --text: #f6f3ee;
    --muted: rgba(246, 243, 238, .68);
    --faint: rgba(246, 243, 238, .16);
    --tint: rgba(13, 15, 22, .46);
    --accent: #ffc27a;
    --accent-ink: #2a1a08;
    --radius: 22px;
  }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #07080c; overflow: hidden; }
  body {
    color: var(--text);
    font-family: system-ui, "Noto Sans", "DejaVu Sans", sans-serif;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  #stage { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; overflow: hidden; transform-origin: 0 0; background: #07080c; }

  .photo { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; opacity: 0; transform: scale(1); will-change: opacity, transform; transition: opacity 1.5s ease, transform 0s linear 1.5s; }
  .photo.on { opacity: 1; transform: scale(1.08); transition: opacity 1.5s ease, transform 9s linear; }

  #grid { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; padding: 20px; display: grid; gap: 14px; grid-template-columns: 372px 1fr 340px; grid-template-rows: 1fr 176px; }

  .glass { position: relative; overflow: hidden; border-radius: var(--radius); background: #14161d; }
  .glass > i { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background-size: 1280px 720px; background-repeat: no-repeat; opacity: 0; transition: opacity 1.5s ease; will-change: opacity; }
  .glass > i.on { opacity: 1; }
  .glass::after { content: ""; position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: var(--tint); border-radius: inherit; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .09); }
  .glass > .body { position: relative; z-index: 1; height: 100%; padding: 20px 22px; display: flex; flex-direction: column; }

  .live .glass { background: transparent; -webkit-backdrop-filter: blur(22px) saturate(140%); backdrop-filter: blur(22px) saturate(140%); }
  .live .glass > i { display: none; }

  .label { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

  #clock { font-size: 88px; font-weight: 300; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  #date { margin-top: 8px; font-size: 18px; color: var(--muted); }
  .now { display: flex; align-items: center; gap: 16px; margin-top: auto; }
  .sun { width: 64px; height: 64px; flex: none; animation: spin 40s linear infinite; }
  .temp { font-size: 58px; font-weight: 300; line-height: 1; letter-spacing: -.02em; }
  .cond { font-size: 15px; line-height: 1.4; color: var(--muted); }
  .hours { display: grid; grid-template-columns: repeat(6, 1fr); margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--faint); text-align: center; }
  .hours b { display: block; font-size: 19px; font-weight: 500; margin-top: 4px; }
  .hours span { font-size: 13px; color: var(--muted); }

  .lights { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; flex: 1; }
  .light { display: flex; flex-direction: column; justify-content: space-between; padding: 12px; text-align: left; border-radius: 15px; background: rgba(255, 255, 255, .09); transition: background-color .2s ease, color .2s ease; }
  .light small { display: block; font-size: 12px; opacity: .72; }
  .light strong { font-size: 15px; font-weight: 600; }
  .light[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .head { display: flex; justify-content: space-between; align-items: baseline; }
  .tag { font-size: 12px; color: var(--muted); }

  #music { grid-column: 2; grid-row: 2; }
  #music .body { flex-direction: row; align-items: center; gap: 18px; padding: 18px; }
  #art { width: 140px; height: 140px; flex: none; border-radius: 14px; }
  .track { flex: 1; min-width: 0; }
  .track h2 { font-size: 22px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track p { margin-top: 2px; font-size: 15px; color: var(--muted); }
  .bar { height: 5px; margin-top: 14px; border-radius: 3px; background: var(--faint); overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); transform-origin: 0 50%; animation: progress 180s linear infinite; }
  .ctl { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
  .ctl button { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 50%; }
  .ctl button.play { background: var(--text); color: #14161d; }
  .ctl svg { width: 22px; height: 22px; fill: currentColor; }
  .eq { display: flex; align-items: flex-end; gap: 4px; height: 26px; margin-left: auto; }
  .eq i { width: 5px; height: 100%; border-radius: 2px; background: var(--accent); transform-origin: 50% 100%; animation: eq 1.1s ease-in-out infinite alternate; }
  .eq i:nth-child(2) { animation-delay: -.5s; animation-duration: .8s; }
  .eq i:nth-child(3) { animation-delay: -.2s; animation-duration: 1.3s; }
  .eq i:nth-child(4) { animation-delay: -.8s; animation-duration: .95s; }

  #cal { grid-column: 3; grid-row: 1 / span 2; }
  #events { position: relative; list-style: none; padding: 0; margin-top: 14px; }
  #marker { position: absolute; left: -10px; right: -10px; top: 0; height: 78px; border-radius: 14px; background: rgba(255, 255, 255, .1); transition: transform .5s cubic-bezier(.2, .7, .2, 1); will-change: transform; }
  .ev { position: relative; height: 78px; padding: 12px 0 0 16px; }
  .ev::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 16px; width: 4px; border-radius: 2px; background: var(--c); }
  .ev time { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ev b { display: block; margin-top: 2px; font-size: 17px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev span { float: right; font-size: 12px; color: var(--muted); }

  #hud { position: absolute; left: 50%; top: 20px; z-index: 5; display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 6px 0 18px; border-radius: 24px; background: rgba(8, 9, 13, .78); font-size: 14px; font-variant-numeric: tabular-nums; transform: translateX(-50%); white-space: nowrap; }
  #hud button { height: 36px; padding: 0 16px; border-radius: 18px; background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  #hud button:disabled { opacity: .55; }

  #results { position: absolute; left: 50%; top: 50%; z-index: 6; width: 720px; padding: 26px 28px; border-radius: var(--radius); background: #14161d; box-shadow: 0 0 0 1px rgba(255, 255, 255, .12); transform: translate(-50%, -50%); display: none; }
  #results.open { display: block; }
  #results h2 { font-size: 22px; font-weight: 600; }
  #results p { margin-top: 4px; font-size: 14px; color: var(--muted); }
  #results table { width: 100%; margin-top: 16px; border-collapse: collapse; font-size: 15px; font-variant-numeric: tabular-nums; }
  #results th, #results td { padding: 10px 8px; text-align: right; border-bottom: 1px solid var(--faint); }
  #results th:first-child, #results td:first-child { text-align: left; }
  #results th { font-size: 12px; font-weight: 600; color: var(--muted); }
  #results button { margin-top: 18px; height: 44px; padding: 0 20px; border-radius: 22px; background: var(--faint); }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes progress { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes eq { from { transform: scaleY(.2); } to { transform: scaleY(1); } }
</style>
</head>
<body>
<div id="stage">
  <img class="photo" id="photoA" alt="">
  <img class="photo" id="photoB" alt="">

  <div id="grid">
    <section class="glass" style="grid-column:1;grid-row:1">
      <i></i><i></i>
      <div class="body">
        <div id="clock">--:--</div>
        <div id="date"></div>
        <div class="now">
          <svg class="sun" viewBox="0 0 64 64" aria-hidden="true">
            <circle cx="32" cy="32" r="13" fill="#ffc27a"/>
            <g stroke="#ffc27a" stroke-width="4" stroke-linecap="round">
              <path d="M32 5v8M32 51v8M5 32h8M51 32h8M12.9 12.9l5.7 5.7M45.4 45.4l5.7 5.7M12.9 51.1l5.7-5.7M45.4 18.6l5.7-5.7"/>
            </g>
          </svg>
          <div class="temp">4°</div>
          <div class="cond">Częściowe zachmurzenie<br>Odczuwalna 1°</div>
        </div>
        <div class="hours" id="hours"></div>
      </div>
    </section>

    <section class="glass" style="grid-column:1;grid-row:2">
      <i></i><i></i>
      <div class="body" style="padding:16px 18px">
        <div class="head"><span class="label">Oświetlenie</span><span class="tag">Makieta</span></div>
        <div class="lights">
          <button class="light" aria-pressed="true"><small>Wł.</small><strong>Lampa 1</strong></button>
          <button class="light" aria-pressed="false"><small>Wył.</small><strong>Lampa 2</strong></button>
          <button class="light" aria-pressed="false"><small>Wył.</small><strong>Taśma LED</strong></button>
        </div>
      </div>
    </section>

    <section class="glass" id="music">
      <i></i><i></i>
      <div class="body">
        <canvas id="art" width="140" height="140"></canvas>
        <div class="track">
          <h2>Utwór testowy</h2>
          <p>Wykonawca testowy</p>
          <div class="bar"><div></div></div>
          <div class="ctl">
            <button aria-label="Poprzedni"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
            <button class="play" aria-label="Pauza"><svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>
            <button aria-label="Następny"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5l11 7-11 7z"/></svg></button>
            <div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
          </div>
        </div>
      </div>
    </section>

    <section class="glass" id="cal">
      <i></i><i></i>
      <div class="body">
        <div class="head"><span class="label">Kalendarz</span><span class="tag">Dziś</span></div>
        <ul id="events"><li id="marker" aria-hidden="true"></li></ul>
      </div>
    </section>
  </div>

  <div id="hud">
    <span id="fps">-- FPS</span>
    <span id="state">Podgląd</span>
    <button id="run">Uruchom test</button>
  </div>

  <div id="results" role="dialog" aria-label="Wyniki testu">
    <h2>Wyniki testu</h2>
    <p id="engine"></p>
    <table>
      <thead><tr><th>Scenariusz</th><th>Średnio FPS</th><th>Klatka p95</th><th>Klatki &gt; 33 ms</th><th>Ocena</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <button id="close">Zamknij</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var W = 1280, H = 720;
  var SCENARIO_SECONDS = Number(new URLSearchParams(location.search).get('seconds')) || 30;
  var WARMUP_MS = 2000;
  var PHOTO_INTERVAL_MS = 6000;
  var SCENARIOS = [
    { name: 'Spoczynek', photos: false, live: false },
    { name: 'Zdjęcia, gotowe rozmycie', photos: true, live: false },
    { name: 'Zdjęcia, rozmycie na żywo', photos: true, live: true }
  ];
  var PALETTES = [
    ['#16304f', '#e9835a', '#f6c98b', '#3a4a5e', '#101a26'],
    ['#2c5d7c', '#9fc6c9', '#f1e3c4', '#3f6650', '#14251d'],
    ['#3d2752', '#c9587a', '#f7b267', '#54304f', '#180f1f'],
    ['#0f3b46', '#3f8f8a', '#d9d58f', '#265244', '#0a1c18'],
    ['#27334f', '#7f8fb5', '#e8d6c9', '#454a63', '#12141f'],
    ['#4a2b1f', '#c8703f', '#f0c674', '#5a3a25', '#1a0f09']
  ];

  var stage = document.getElementById('stage');
  var photoEls = [document.getElementById('photoA'), document.getElementById('photoB')];
  var panels = Array.prototype.slice.call(document.querySelectorAll('.glass'));
  var photos = [];
  var photoIndex = 0, activeLayer = 0, photoTimer = null;

  function fit() {
    var scale = Math.min(innerWidth / W, innerHeight / H);
    stage.style.transform = scale === 1 ? 'none' : 'scale(' + scale + ')';
  }
  addEventListener('resize', fit);
  fit();

  function rng(seed) {
    return function () {
      seed = (seed * 16807) % 2147483647;
      return (seed - 1) / 2147483646;
    };
  }

  function grain() {
    var c = document.createElement('canvas');
    c.width = c.height = 256;
    var g = c.getContext('2d');
    var d = g.createImageData(256, 256);
    var r = rng(4242);
    for (var i = 0; i < d.data.length; i += 4) {
      var v = r() * 255;
      d.data[i] = d.data[i + 1] = d.data[i + 2] = v;
      d.data[i + 3] = 10;
    }
    g.putImageData(d, 0, 0);
    return c;
  }

  function paint(ctx, palette, seed, noise) {
    var r = rng(seed * 7919 + 13);
    var sky = ctx.createLinearGradient(0, 0, 0, H * 0.72);
    sky.addColorStop(0, palette[0]);
    sky.addColorStop(0.62, palette[1]);
    sky.addColorStop(1, palette[2]);
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    var sx = W * (0.3 + r() * 0.4), sy = H * (0.36 + r() * 0.16);
    var sun = ctx.createRadialGradient(sx, sy, 8, sx, sy, 300);
    sun.addColorStop(0, 'rgba(255,240,210,.95)');
    sun.addColorStop(0.14, 'rgba(255,225,180,.5)');
    sun.addColorStop(1, 'rgba(255,220,170,0)');
    ctx.fillStyle = sun;
    ctx.fillRect(0, 0, W, H);

    for (var layer = 0; layer < 6; layer++) {
      var t = layer / 5;
      var base = H * (0.5 + t * 0.4);
      var a1 = 26 + r() * 50, a2 = 8 + r() * 22, a3 = 3 + r() * 8;
      var f1 = 0.003 + r() * 0.004, f2 = 0.011 + r() * 0.012, f3 = 0.04 + r() * 0.05;
      var p1 = r() * 9, p2 = r() * 9, p3 = r() * 9;
      ctx.beginPath();
      ctx.moveTo(0, H);
      for (var x = 0; x <= W; x += 4) {
        ctx.lineTo(x, base + Math.sin(x * f1 + p1) * a1 + Math.sin(x * f2 + p2) * a2 + Math.sin(x * f3 + p3) * a3);
      }
      ctx.lineTo(W, H);
      ctx.closePath();
      ctx.globalAlpha = 0.72 + t * 0.28;
      ctx.fillStyle = t < 0.5 ? palette[3] : palette[4];
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = ctx.createPattern(noise, 'repeat');
    ctx.fillRect(0, 0, W, H);
  }

  function blob(canvas, quality) {
    return new Promise(function (resolve) {
      canvas.toBlob(function (b) { resolve(URL.createObjectURL(b)); }, 'image/jpeg', quality);
    });
  }

  function softened(source) {
    var small = document.createElement('canvas');
    small.width = 40; small.height = 23;
    var s = small.getContext('2d');
    s.imageSmoothingQuality = 'high';
    s.drawImage(source, 0, 0, 40, 23);
    var out = document.createElement('canvas');
    out.width = 320; out.height = 180;
    var o = out.getContext('2d');
    o.imageSmoothingQuality = 'high';
    o.drawImage(small, 0, 0, 320, 180);
    return out;
  }

  function buildPhotos() {
    var noise = grain();
    var jobs = PALETTES.map(function (palette, i) {
      var c = document.createElement('canvas');
      c.width = W; c.height = H;
      paint(c.getContext('2d'), palette, i + 1, noise);
      return Promise.all([blob(c, 0.88), blob(softened(c), 0.82)]).then(function (urls) {
        return { full: urls[0], soft: urls[1] };
      });
    });
    return Promise.all(jobs);
  }

  function alignPanels() {
    panels.forEach(function (panel) {
      var x = -panel.offsetLeft, y = -panel.offsetTop;
      panel.querySelectorAll(':scope > i').forEach(function (layer) {
        layer.style.backgroundPosition = x + 'px ' + y + 'px';
      });
    });
  }

  function showPhoto(index) {
    var next = 1 - activeLayer;
    var photo = photos[index];
    var el = photoEls[next];
    el.src = photo.full;
    var ready = el.decode ? el.decode().catch(function () {}) : Promise.resolve();
    return ready.then(function () {
      photoEls[activeLayer].classList.remove('on');
      el.classList.add('on');
      panels.forEach(function (panel) {
        var layers = panel.querySelectorAll(':scope > i');
        layers[next].style.backgroundImage = 'url(' + photo.soft + ')';
        layers[activeLayer].classList.remove('on');
        layers[next].classList.add('on');
      });
      activeLayer = next;
    });
  }

  function setScenario(s) {
    document.body.classList.toggle('live', s.live);
    clearInterval(photoTimer);
    if (s.photos) {
      photoTimer = setInterval(function () {
        photoIndex = (photoIndex + 1) % photos.length;
        showPhoto(photoIndex);
      }, PHOTO_INTERVAL_MS);
    }
  }

  var frames = [], last = 0, hudFrames = 0, hudStart = 0;
  var fpsEl = document.getElementById('fps');
  function tick(now) {
    if (last) frames.push(now - last);
    last = now;
    hudFrames++;
    if (now - hudStart >= 500) {
      fpsEl.textContent = Math.round(hudFrames * 1000 / (now - hudStart)) + ' FPS';
      hudFrames = 0;
      hudStart = now;
    }
    requestAnimationFrame(tick);
  }

  function summarize(name, samples) {
    var total = samples.reduce(function (a, b) { return a + b; }, 0);
    var sorted = samples.slice().sort(function (a, b) { return a - b; });
    var long = samples.filter(function (d) { return d > 33.4; }).length;
    var fps = samples.length * 1000 / total;
    var longPct = long * 100 / samples.length;
    var verdict = fps >= 55 && longPct <= 2 ? 'Płynnie' : fps >= 45 ? 'Akceptowalnie' : 'Za wolno';
    return {
      name: name,
      fps: Math.round(fps * 10) / 10,
      p95: Math.round(sorted[Math.floor(sorted.length * 0.95)] * 10) / 10,
      longPct: Math.round(longPct * 10) / 10,
      verdict: verdict
    };
  }

  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  var stateEl = document.getElementById('state');
  var runBtn = document.getElementById('run');
  var resultsEl = document.getElementById('results');

  function renderResults(list) {
    document.getElementById('engine').textContent =
      (/Chrome\//.test(navigator.userAgent) ? 'Chromium' : 'WebKit') + ' · ' +
      innerWidth + '×' + innerHeight + ' · ' + navigator.userAgent;
    var rows = document.getElementById('rows');
    rows.textContent = '';
    list.forEach(function (r) {
      var tr = document.createElement('tr');
      [r.name, r.fps.toFixed(1), r.p95.toFixed(1) + ' ms', r.longPct.toFixed(1) + '%', r.verdict].forEach(function (v) {
        var td = document.createElement('td');
        td.textContent = v;
        tr.appendChild(td);
      });
      rows.appendChild(tr);
    });
    resultsEl.classList.add('open');
  }

  async function runTest() {
    runBtn.disabled = true;
    resultsEl.classList.remove('open');
    var list = [];
    for (var i = 0; i < SCENARIOS.length; i++) {
      var s = SCENARIOS[i];
      stateEl.textContent = (i + 1) + '/' + SCENARIOS.length + ' ' + s.name;
      setScenario(s);
      await wait(WARMUP_MS);
      frames = [];
      await wait(SCENARIO_SECONDS * 1000);
      list.push(summarize(s.name, frames));
    }
    setScenario(SCENARIOS[1]);
    stateEl.textContent = 'Podgląd';
    runBtn.disabled = false;
    window.__spikeResults = list;
    console.log('SPIKE_RESULTS ' + JSON.stringify(list));
    renderResults(list);
  }

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  var DAYS = ['niedziela', 'poniedziałek', 'wtorek', 'środa', 'czwartek', 'piątek', 'sobota'];
  var MONTHS = ['stycznia', 'lutego', 'marca', 'kwietnia', 'maja', 'czerwca', 'lipca', 'sierpnia', 'września', 'października', 'listopada', 'grudnia'];
  function clock() {
    var d = new Date();
    document.getElementById('clock').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
    document.getElementById('date').textContent = DAYS[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()];
  }

  function fillMock() {
    var hours = document.getElementById('hours');
    [['12', '4°'], ['13', '5°'], ['14', '5°'], ['15', '4°'], ['16', '3°'], ['17', '2°']].forEach(function (h) {
      var cell = document.createElement('div');
      var label = document.createElement('span');
      var value = document.createElement('b');
      label.textContent = h[0] + ':00';
      value.textContent = h[1];
      cell.appendChild(label);
      cell.appendChild(value);
      hours.appendChild(cell);
    });

    var events = document.getElementById('events');
    [
      ['09:00', 'Spotkanie zespołu', 'Firma A', '#7fb4ff'],
      ['10:30', 'Przegląd projektu', 'Firma A', '#7fb4ff'],
      ['12:00', 'Konsultacje techniczne', 'Firma B', '#8fd6a8'],
      ['13:30', 'Planowanie sprintu', 'Firma B', '#8fd6a8'],
      ['15:00', 'Omówienie wyników', 'Firma A', '#7fb4ff'],
      ['16:30', 'Podsumowanie tygodnia', 'Firma B', '#8fd6a8'],
      ['18:00', 'Trening', 'Prywatne', '#ffc27a']
    ].forEach(function (e) {
      var li = document.createElement('li');
      li.className = 'ev';
      li.style.setProperty('--c', e[3]);
      var tag = document.createElement('span');
      tag.textContent = e[2];
      var time = document.createElement('time');
      time.textContent = e[0];
      var title = document.createElement('b');
      title.textContent = e[1];
      li.appendChild(tag);
      li.appendChild(time);
      li.appendChild(title);
      events.appendChild(li);
    });

    var marker = document.getElementById('marker'), pos = 0;
    setInterval(function () {
      pos = (pos + 1) % 7;
      marker.style.transform = 'translateY(' + pos * 78 + 'px)';
    }, 4000);

    var art = document.getElementById('art').getContext('2d');
    var g = art.createLinearGradient(0, 0, 140, 140);
    g.addColorStop(0, '#ff9a6b');
    g.addColorStop(0.55, '#b4477f');
    g.addColorStop(1, '#2c2460');
    art.fillStyle = g;
    art.fillRect(0, 0, 140, 140);
    art.fillStyle = 'rgba(255,255,255,.2)';
    art.beginPath();
    art.arc(98, 44, 28, 0, Math.PI * 2);
    art.fill();

    document.querySelectorAll('.light').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var on = btn.getAttribute('aria-pressed') !== 'true';
        btn.setAttribute('aria-pressed', String(on));
        btn.querySelector('small').textContent = on ? 'Wł.' : 'Wył.';
      });
    });
  }

  runBtn.addEventListener('click', runTest);
  document.getElementById('close').addEventListener('click', function () { resultsEl.classList.remove('open'); });

  clock();
  setInterval(clock, 1000);
  fillMock();
  alignPanels();
  stateEl.textContent = 'Przygotowanie';
  runBtn.disabled = true;

  buildPhotos().then(function (built) {
    photos = built;
    return showPhoto(0);
  }).then(function () {
    setScenario(SCENARIOS[1]);
    stateEl.textContent = 'Podgląd';
    runBtn.disabled = false;
    window.__spikeReady = true;
    requestAnimationFrame(tick);
    if (new URLSearchParams(location.search).get('auto') === '1') runTest();
  });
})();
</script>
</body>
</html>
