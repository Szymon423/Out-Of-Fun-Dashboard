# Out Of Fun Dashboard: Poky with systemd and Wayland, without X11.
require conf/distro/poky.conf

DISTRO = "dashboard"
DISTRO_NAME = "Out Of Fun Dashboard"
DISTRO_VERSION = "0.3"

INIT_MANAGER = "systemd"
DISTRO_FEATURES:remove = "x11 ptest 3g nfc pulseaudio"
# pam: Weston under systemd needs it. rauc: A/B updates from meta-rauc (docs/ota-rauc.md).
DISTRO_FEATURES:append = " pam rauc"

LICENSE_FLAGS_ACCEPTED += "synaptics-killswitch"
DEFAULT_TIMEZONE = "Europe/Warsaw"
hostname:pn-base-files = "dashboard"

# No getty on the serial port: nothing is attached to the UART, and while the UART was
# disabled, getty on ttyS0 waited 90 s for a device that never appeared.
SERIAL_CONSOLES = ""

# Boot through U-Boot, which picks the A/B rootfs slot for RAUC (docs/ota-rauc.md).
# meta-raspberrypi then adds enable_uart=1 to config.txt, which U-Boot needs on the Pi 4.
RPI_USE_U_BOOT = "1"

# Compressed kernel: U-Boot reads the SD card at only about 5 MB/s, so the 27 MB Image
# took 5.6 s to load. Image.gz (11 MB) loads in 2.3 s and unpacks in 0.3 s.
KERNEL_IMAGETYPE_UBOOT = "Image.gz"
