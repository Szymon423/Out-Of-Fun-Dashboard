# Out Of Fun Dashboard: Poky with systemd and Wayland, without X11.
require conf/distro/poky.conf

DISTRO = "dashboard"
DISTRO_NAME = "Out Of Fun Dashboard"
DISTRO_VERSION = "0.1"

INIT_MANAGER = "systemd"
DISTRO_FEATURES:remove = "x11 ptest 3g nfc pulseaudio"

LICENSE_FLAGS_ACCEPTED += "synaptics-killswitch"
DEFAULT_TIMEZONE = "Europe/Warsaw"
hostname:pn-base-files = "dashboard"
