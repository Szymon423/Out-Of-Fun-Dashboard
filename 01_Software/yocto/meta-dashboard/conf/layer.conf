# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-dashboard"
BBFILE_PATTERN_meta-dashboard = "^${LAYERDIR}/"
# Highest priority of all layers: BitBake applies .bbappend files from the lowest layer
# priority up, so ours come last and our files win over the BSP's (meta-raspberrypi is 9).
BBFILE_PRIORITY_meta-dashboard = "10"

LAYERDEPENDS_meta-dashboard = "core yocto raspberrypi"
LAYERSERIES_COMPAT_meta-dashboard = "wrynose"
