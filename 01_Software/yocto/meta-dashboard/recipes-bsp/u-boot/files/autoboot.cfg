# Boot at once without checking for a key press: nothing is attached to the UART,
# and noise on its input could otherwise stop the boot at the U-Boot prompt.
CONFIG_BOOTDELAY=-2
# No "pci enum; usb start" before booting: we boot from the SD card and Linux brings up
# PCIe and USB itself. Disabled in the build, so a preboot variable stored in the
# environment on the card has no effect either. Saves about 2.5 s.
# CONFIG_USE_PREBOOT is not set
