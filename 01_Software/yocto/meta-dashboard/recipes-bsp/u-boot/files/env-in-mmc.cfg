# Environment in raw sectors of the SD card, outside any partition, instead of uboot.env
# on the FAT boot partition: the A/B slot choice must survive an update of that partition.
# Two copies, so a power cut during saveenv loses nothing. The offsets must match
# fw_env.config; the first partition starts at 4 MiB.
# CONFIG_ENV_IS_IN_FAT is not set
CONFIG_ENV_IS_IN_MMC=y
CONFIG_ENV_MMC_DEVICE_INDEX=0
CONFIG_ENV_SIZE=0x4000
CONFIG_ENV_OFFSET=0x100000
CONFIG_ENV_REDUNDANT=y
CONFIG_ENV_OFFSET_REDUND=0x120000
