[core]
# One application full screen, no desktop or panel.
shell=kiosk-shell.so
# Never blank the screen.
idle-time=0
# Start even if the touchscreen is not detected.
require-input=false

[output]
# The panel is natively portrait (720x1280); rotate it to landscape.
# If the picture is upside down, use rotate-270.
name=DSI-1
transform=rotate-270
