# SSH host key on /data, so it survives updates of the rootfs slots (docs/ota-rauc.md).
# The empty ConditionPathExists= drops the unit's own conditions on /etc/dropbear and
# /var/lib/dropbear, which would make it generate a new key on every boot.
[Unit]
RequiresMountsFor=/data
ConditionPathExists=
ConditionPathExists=!/data/dropbear/dropbear_rsa_host_key

[Service]
Environment=DROPBEAR_RSAKEY_DIR=/data/dropbear
