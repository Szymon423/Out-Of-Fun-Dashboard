# Hardware watchdog (bcm2835-wdt, at most 15 s). systemd pings it every 7.5 s, so if PID 1
# hangs, the Pi resets itself, and U-Boot counts that as a failed try of the slot
# (docs/ota-rauc.md, OTA-4). RebootWatchdogSec limits a shutdown or reboot that hangs.
[Manager]
RuntimeWatchdogSec=15s
RebootWatchdogSec=1min
