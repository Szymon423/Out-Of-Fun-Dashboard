# RAUC system configuration (docs/ota-rauc.md). U-Boot picks the slot from BOOT_ORDER
# and BOOT_A_LEFT / BOOT_B_LEFT (boot.cmd.in); the slot status lives on /data.
[system]
compatible=out-of-fun-dashboard-rpi4
bootloader=uboot
data-directory=/data/rauc
bundle-formats=-plain

[keyring]
path=ca.cert.pem

# The bundle's ext4 image is smaller than the 2 GiB slot; resize grows it to the slot.
[slot.rootfs.0]
device=/dev/mmcblk0p2
type=ext4
bootname=A
resize=true

[slot.rootfs.1]
device=/dev/mmcblk0p3
type=ext4
bootname=B
resize=true
